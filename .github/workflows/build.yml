name: Build OpenClaw

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"


    - name: Setup pnpm
      uses: pnpm/action-setup@v4


    - name: Verify
      run: |
        node -v
        pnpm -v


    - name: Install dependencies
      run: |
        pnpm install --frozen-lockfile


    - name: Build OpenClaw
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
      run: |
        pnpm build


    - name: Package
      run: |
        mkdir -p release

        cp -r dist release/ || true
        cp -r packages release/ || true
        cp -r node_modules release/ || true
        cp package.json release/
        cp pnpm-lock.yaml release/

        tar -czf openclaw-build.tar.gz release


    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openclaw-build
        path: openclaw-build.tar.gz
        retention-days: 7
