name: Build OpenClaw

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Install dependencies
      run: |
        pnpm install

    - name: Build
      run: |
        NODE_OPTIONS="--max-old-space-size=8192" pnpm build

    - name: Package
      run: |
        tar -czf openclaw-build.tar.gz \
        dist \
        node_modules \
        package.json \
        pnpm-lock.yaml

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openclaw-build
        path: openclaw-build.tar.gz
